name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: larkspur
          POSTGRES_PASSWORD: larkspur
          POSTGRES_DB: larkspur_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://larkspur:larkspur@localhost:5432/larkspur_test
      SECRET_KEY: ${{ secrets.LARKSPUR_SECRET_KEY }}
      PAGE_SIZE: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --maxfail=1
